<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF Checker — Under Development</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sora', sans-serif; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.02); opacity: 1; }
        }
    </style>
<base target="_blank">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="text-center max-w-lg">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-white shadow-md mb-6 pulse">
            <i class="bi bi-tools text-4xl text-gray-800"></i>
        </div>

        <h1 class="text-3xl font-bold mb-2">PDF Checker</h1>
        <span class="inline-block text-sm bg-red-100 text-red-700 px-3 py-1 rounded-full font-medium mb-4">Under Development</span>

        <p class="text-gray-500 text-base leading-relaxed mb-8">
            The PDF annotation and verification suite is being rebuilt.<br>
            Drag & drop preview, markup tools, and export features coming soon.
        </p>

        <div class="flex flex-wrap gap-2 justify-center text-sm text-gray-400">
            <span class="bg-white px-3 py-1 rounded-full shadow-sm"><i class="bi bi-filetype-pdf mr-1"></i>PDF.js</span>
            <span class="bg-white px-3 py-1 rounded-full shadow-sm"><i class="bi bi-pen mr-1"></i>Markup</span>
            <span class="bg-white px-3 py-1 rounded-full shadow-sm"><i class="bi bi-layers mr-1"></i>Categories</span>
        </div>

        <p class="mt-8 text-xs text-gray-400">Expected release: soon</p>
    </div>

    <footer class="fixed bottom-6 text-xs text-gray-400">
        &copy; 2025 PDF Checker | Rain Gutter Department
    </footer>

</body>
</html>
